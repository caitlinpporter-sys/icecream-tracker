<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚚 Truck Driver Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background: linear-gradient(160deg, #f0f9ff 0%, #e0f2fe 100%); min-height: 100vh; padding: 20px 16px 40px; }

    .hero { text-align: center; margin-bottom: 20px; }
    .hero .emoji { font-size: 52px; display: block; margin-bottom: 6px; animation: drive 2s ease-in-out infinite alternate; }
    @keyframes drive { 0%{transform:translateX(-6px)} 100%{transform:translateX(6px)} }
    .hero h1 { font-size: 24px; font-weight: 800; color: #1d4ed8; margin-bottom: 4px; }
    .hero p { font-size: 14px; color: #60a5fa; font-weight: 600; }

    .card { background: white; border-radius: 20px; padding: 16px; margin-bottom: 14px; box-shadow: 0 4px 20px rgba(29,78,216,0.08); border: 1.5px solid #dbeafe; }

    #map { width: 100%; height: 320px; border-radius: 14px; z-index: 1; }

    .stats-row { display: flex; gap: 10px; justify-content: space-around; }
    .stat-bubble { background: linear-gradient(135deg, #eff6ff, #dbeafe); border-radius: 16px; padding: 12px 16px; text-align: center; flex: 1; border: 1.5px solid #bfdbfe; }
    .stat-val { font-size: 20px; font-weight: 800; color: #1d4ed8; }
    .stat-lbl { font-size: 11px; color: #60a5fa; font-weight: 600; margin-top: 2px; }

    .status-big { text-align: center; padding: 16px; }
    .status-big .dot-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px; }
    .big-dot { width: 16px; height: 16px; border-radius: 50%; background: #f5a0d0; animation: blink 1.2s ease-in-out infinite; }
    .big-dot.live { background: #22c55e; animation: none; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .status-label { font-size: 16px; font-weight: 800; color: #1d4ed8; }

    .btn { font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800; padding: 15px 24px; border-radius: 50px; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.1s; width: 100%; margin-bottom: 10px; }
    .btn:active { transform: scale(0.97); }
    .btn-green { background: linear-gradient(135deg, #4ade80, #22c55e); color: white; box-shadow: 0 4px 14px rgba(34,197,94,0.35); }
    .btn-red { background: linear-gradient(135deg, #f87171, #ef4444); color: white; box-shadow: 0 4px 14px rgba(239,68,68,0.3); }
    .btn-disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; }

    #location-banner { background: #fff8e1; border: 1.5px solid #f5c842; border-radius: 14px; padding: 12px 14px; font-size: 13px; color: #8a6000; display: none; align-items: center; gap: 8px; margin-bottom: 14px; font-weight: 600; }

    .tip { font-size: 13px; color: #93c5fd; text-align: center; font-weight: 600; line-height: 1.6; }

    .kids-count { font-size: 36px; font-weight: 800; color: #1d4ed8; }
  </style>
</head>
<body>

  <div class="hero">
    <span class="emoji">🚚</span>
    <h1>Driver Dashboard</h1>
    <p>Let the neighborhood know you're coming!</p>
  </div>

  <div id="location-banner"><span>📍</span> <span id="location-text">Getting your location...</span></div>

  <div class="card">
    <div class="status-big">
      <div class="dot-wrap">
        <div class="big-dot" id="big-dot"></div>
        <span class="status-label" id="big-status">Not sharing yet</span>
      </div>
      <p class="tip" id="tip-text">Start sharing so kids can track you on the map!</p>
    </div>

    <button class="btn btn-green" id="share-btn" onclick="startSharing()">🟢 Start sharing my location</button>
    <button class="btn btn-red" id="stop-btn" onclick="stopSharing()" style="display:none">🔴 Stop sharing</button>
  </div>

  <div class="card" style="padding: 0; overflow: hidden;">
    <div id="map"></div>
  </div>

  <div class="card">
    <div class="stats-row">
      <div class="stat-bubble"><div class="stat-val" id="lat-val">—</div><div class="stat-lbl">latitude</div></div>
      <div class="stat-bubble"><div class="stat-val" id="lng-val">—</div><div class="stat-lbl">longitude</div></div>
      <div class="stat-bubble"><div class="stat-val" id="acc-val">—</div><div class="stat-lbl">accuracy (m)</div></div>
    </div>
  </div>

  <p class="tip" style="margin-top: 4px;">Share the kids link 👉 <strong style="color:#1d4ed8">yoursite.github.io/icecream-tracker</strong><br>This page is just for you, the driver!</p>

  <script>
    let map, myMarker, watchId;
    let isSharing = false;

    const truckIcon = L.divIcon({
      html: '<div style="font-size:36px;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,0.25))">🚚</div>',
      className: '', iconAnchor: [18, 18]
    });

    function initMap(lat, lng) {
      map = L.map('map').setView([lat, lng], 16);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap', maxZoom: 19
      }).addTo(map);
      myMarker = L.marker([lat, lng], { icon: truckIcon }).addTo(map).bindPopup('📍 You are here');
    }

    function startSharing() {
      if (!navigator.geolocation) { alert('Geolocation not supported.'); return; }
      isSharing = true;
      document.getElementById('share-btn').style.display = 'none';
      document.getElementById('stop-btn').style.display = 'flex';
      document.getElementById('big-dot').classList.add('live');
      document.getElementById('big-status').textContent = 'Live — kids can see you! 🎉';
      document.getElementById('tip-text').textContent = 'Your location updates automatically as you drive.';
      watchId = navigator.geolocation.watchPosition(
        pos => {
          const lat = pos.coords.latitude, lng = pos.coords.longitude;
          document.getElementById('lat-val').textContent = lat.toFixed(4);
          document.getElementById('lng-val').textContent = lng.toFixed(4);
          document.getElementById('acc-val').textContent = Math.round(pos.coords.accuracy);
          if (!map) { initMap(lat, lng); }
          else { myMarker.setLatLng([lat, lng]); map.panTo([lat, lng]); }
          document.getElementById('location-banner').style.display = 'none';
        },
        err => {
          const b = document.getElementById('location-banner');
          b.style.display = 'flex';
          document.getElementById('location-text').textContent = err.code === 1
            ? '🔒 Location denied — check browser settings.'
            : '😕 GPS error. Make sure location is on.';
        },
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
      );
    }

    function stopSharing() {
      if (watchId) navigator.geolocation.clearWatch(watchId);
      isSharing = false;
      document.getElementById('share-btn').style.display = 'flex';
      document.getElementById('stop-btn').style.display = 'none';
      document.getElementById('big-dot').classList.remove('live');
      document.getElementById('big-status').textContent = 'Not sharing';
      document.getElementById('tip-text').textContent = 'Start sharing so kids can track you on the map!';
    }

    window.onload = () => {
      const b = document.getElementById('location-banner');
      b.style.display = 'flex';
      document.getElementById('location-text').textContent = 'Tap "Start sharing" to go live!';
      if (!map) {
        navigator.geolocation.getCurrentPosition(
          pos => { initMap(pos.coords.latitude, pos.coords.longitude); b.style.display = 'none'; },
          () => { initMap(40.7128, -74.006); }
        );
      }
    };
  </script>
</body>
</html>
